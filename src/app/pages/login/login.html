<div class="login-page d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="login-card shadow">
    <div class="login-header text-center mb-4">
      <div class="brand-icon mb-3">
        <span>HR</span>
      </div>
      <h1 class="h4 mb-1">Employee Management Login</h1>
      <p class="text-muted mb-0">Sign in to access the employee dashboard</p>
    </div>

    <form class="login-form">
      <div class="mb-3">
        <label for="userName" class="form-label">Username</label>
        <input type="text" id="userName" name="userName"  [(ngModel)]= "loginObj.userName" class="form-control" placeholder="Enter your username" />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]= "loginObj.password" class="form-control" placeholder="Enter your password" />
      </div>

      <button type="submit" class="btn btn-primary w-100" (click)="onLogin()">Sign In</button>
    </form>

    <div class="login-footer text-center mt-4">
      <p class="mb-1">New to the system?</p>
      <a href="#" class="link-secondary">Contact HR for access</a>
    </div>
  </div>
</div>
